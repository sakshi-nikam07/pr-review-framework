# Put this file in the repository whose Pull Requests you want reviewed (e.g. demo-shop-app).
# The reviewer code lives in its own repo; replace sakshi-nikam07/pr-review-framework below.
name: AI PR Review
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the PR code
        uses: actions/checkout@v4
      - name: Checkout the reviewer tool
        uses: actions/checkout@v4
        with:
          repository: sakshi-nikam07/pr-review-framework
          path: .reviewer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run review
        run: python .reviewer/main.py review-pr --lang en
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Optional real LLM agent: add repo secret ANTHROPIC_API_KEY and append  --use-llm  above
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
